                data = android.net.Uri.parse("package:$packageName")
            }
            startActivity(intent)
            Toast.makeText(this, "Grant all permissions in Settings", Toast.LENGTH_LONG).show()
        }

        testEngineButton.setOnClickListener {
            testEngine()
        }

        accessibilityButton.setOnClickListener {
            val intent = Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
            startActivity(intent)
            Toast.makeText(this, "Enable Aegis AppControlService", Toast.LENGTH_LONG).show()
        }
    }

    private fun loadPreferences() {
        val prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
        modelPathInput.setText(prefs.getString(KEY_MODEL_PATH, DEFAULT_MODEL_PATH))
        gpuLayersInput.setText(prefs.getInt(KEY_GPU_LAYERS, DEFAULT_GPU_LAYERS).toString())
        contextSizeInput.setText(prefs.getInt(KEY_CONTEXT_SIZE, DEFAULT_CONTEXT_SIZE).toString())
    }

    private fun savePreferences() {
        val prefs = getSharedPreferences(PREFS_NAME, MODE_PRIVATE)
        prefs.edit().apply {
