        contextSizeInput = findViewById(R.id.context_size_input)
        statusText = findViewById(R.id.status_text)
        saveButton = findViewById(R.id.save_button)
        grantPermissionsButton = findViewById(R.id.grant_permissions_button)
        testEngineButton = findViewById(R.id.test_engine_button)
        accessibilityButton = findViewById(R.id.accessibility_button)

        saveButton.setOnClickListener { savePreferences() }
        
        grantPermissionsButton.setOnClickListener {
