tab-slug=0-10-years-of-alphago-the-turning-point-for-ai id=tab-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-0 role=tab tabindex=0><div class=tab-button__title-group><span class=tab-button__title>10 years of AlphaGo: The turning point for AI</span><div class=tab-button__subtitle><p data-block-key=uiqsl>Exactly one decade later, we look back at the match that sparked the modern AI revolution.</p></div></div></div><div class="tab-panels hide-small-up" id=tab-panels-2bc42e7d-d9c6-4828-8a36-6edf18d265ef></div></div><div class=tab-wrapper><div aria-controls=panel-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-1 aria-selected=false class=tab-button data-index=1 data-tab-slug=1-the-future-of-intelligence id=tab-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-1 role=tab tabindex=0><div class=tab-button__title-group><span class=tab-button__title>The future of intelligence</span><div class=tab-button__subtitle><p data-block-key=uiqsl>Demis shares his vision for the path to AGI - from solving "root node" problems in fusion energy and material science to the rise of world models and simulations.</p></div></div></div><div class="tab-panels hide-small-up" id=tab-panels-2bc42e7d-d9c6-4828-8a36-6edf18d265ef></div></div><div class=tab-wrapper><div aria-controls=panel-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-2 aria-selected=false class=tab-button data-index=2 data-tab-slug=2-the-arrival-of-agi id=tab-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-2 role=tab tabindex=0><div class=tab-button__title-group><span class=tab-button__title>The arrival of AGI</span><div class=tab-button__subtitle><p data-block-key=uiqsl>Shane walks host Hannah Fry through his AGI framework, breaking down the levels from minimal AGI to full AGI, and his timelines for each.</p></div></div></div><div class="tab-panels hide-small-up" id=tab-panels-2bc42e7d-d9c6-4828-8a36-6edf18d265ef></div></div><div class=tab-wrapper><div aria-controls=panel-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-3 aria-selected=false class=tab-button data-index=3 data-tab-slug=3-google-deepmind-robotics-lab-tour id=tab-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-3 role=tab tabindex=0><div class=tab-button__title-group><span class=tab-button__title>Google DeepMind robotics lab tour</span><div class=tab-button__subtitle><p data-block-key=uiqsl>Hannah interacts with a new set of robots—those that don't just see, but think, plan, and do.</p></div></div></div><div class="tab-panels hide-small-up" id=tab-panels-2bc42e7d-d9c6-4828-8a36-6edf18d265ef></div></div><div class=tab-wrapper><div aria-controls=panel-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-4 aria-selected=false class=tab-button data-index=4 data-tab-slug=4-alphafold-grand-challenge-to-nobel-prize id=tab-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-4 role=tab tabindex=0><div class=tab-button__title-group><span class=tab-button__title>AlphaFold: Grand challenge to Nobel Prize</span><div class=tab-button__subtitle><p data-block-key=uiqsl>Five years ago, AlphaFold 2 solved the protein structure prediction problem, unlocking new avenues of biological research and providing our first major proof point that AI can be a powerful tool to advance science and cure disease.</p></div></div></div><div class="tab-panels hide-small-up" id=tab-panels-2bc42e7d-d9c6-4828-8a36-6edf18d265ef></div></div></div></div><div class="tabs__panels hidden show-small-up" id=tabs__panels-2bc42e7d-d9c6-4828-8a36-6edf18d265ef><div class="tab-panel tab-panel--active" aria-labelledby=tab-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-0 id=panel-2bc42e7d-d9c6-4828-8a36-6edf18d265ef-0 role=tabpanel><div class=tab-panel__content><div class=media-content-wrapper><div class="media__container no-light-mode-mobile no-dark-mode no-dark-mode-mobile has-default-media spacer-block-none-bottom"><div class=media-embed><div class="media-embed__container media-content-wrapper media--aspect-3-2 media--with-border --scrim media-lightbox"><button class="media-embed__poster-control media-embed__poster-button lightbox__button" aria-hidden=true tabindex=-1 type=button></button><div cl