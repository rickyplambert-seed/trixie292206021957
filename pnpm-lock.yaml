        const x = (i / pts) * W;
        const y = baseLevel + 14 + Math.sin(x * 0.032 + t * 1.6) * 4 + Math.cos(x * 0.018 - t * 0.9) * 3;
        d2 += ` L ${x.toFixed(1)} ${y.toFixed(2)}`;
